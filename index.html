<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务器机组控制面板模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1720'/%3E%3Crect x='5' y='6' width='14' height='5' rx='1' fill='%2334c98a'/%3E%3Crect x='5' y='14' width='14' height='5' rx='1' fill='%235b9bd5'/%3E%3Crect x='5' y='22' width='14' height='5' rx='1' fill='%23f2b03e'/%3E%3Ccircle cx='23' cy='24' r='2.4' fill='%2334c98a'/%3E%3Cpath d='M25 8h4M27 10v-4' stroke='%2334c98a' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1116;
  --bg-2:#10171e;
  --panel:#131b23;
  --panel-2:#18222c;
  --panel-3:#1e2a36;
  --line:#24313d;
  --line-2:#31404e;
  --text:#d9e2e8;
  --text-dim:#8da0ae;
  --text-faint:#5d7280;
  --green:#2ec98a;
  --green-d:#1f9d68;
  --amber:#f2a93b;
  --red:#e2675b;
  --blue:#5b9bd5;
  --cyan:#3ec7d8;
  --violet:#9b8ce0;
  --shadow:0 8px 26px rgba(0,0,0,.4);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
code,.mono,.num{font-family:"JetBrains Mono","Noto Sans SC",monospace}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局 ===== */
.app{display:grid;grid-template-rows:52px 1fr 30px;grid-template-columns:224px 1fr 320px;height:100vh}
.toolbar{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.left-panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.main{position:relative;overflow:hidden;display:flex;flex-direction:column}
.right-panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto}
.statusbar{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg-2);border-top:1px solid var(--line);font-size:11px;color:var(--text-dim)}

/* ===== 顶栏 ===== */
.brand{display:flex;align-items:center;gap:10px;margin-right:8px;padding-right:14px;border-right:1px solid var(--line)}
.brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand span{font-size:10px;color:var(--text-faint);display:block;margin-top:1px}
.tbtn{height:32px;padding:0 11px;border-radius:7px;font-size:12px;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap}
.tbtn:hover{color:var(--text);background:var(--panel-2)}
.tbtn svg{flex:none}
.tbtn.green{background:var(--green-d);color:#07130d;font-weight:600}
.tbtn.green:hover{background:var(--green)}
.tbtn.amber{background:#8a5a1c;color:#ffedcf;font-weight:600}
.tbtn.amber:hover{background:var(--amber);color:#1a1206}
.tbtn.red{background:#7a3028;color:#ffe1dd;font-weight:600}
.tbtn.red:hover{background:var(--red);color:#1d0704}
.tbtn.ghost{border-color:var(--line);background:var(--panel)}
.tbtn.ghost:hover{background:var(--panel-2)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.kpi-pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:11px}
.kpi-pill .l{color:var(--text-faint)}
.kpi-pill .v{font-weight:600;color:var(--text)}
.kpi-pill .v.hot{color:var(--amber)}
.kpi-pill .v.bad{color:var(--red)}
.kpi-pill .dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 左面板：机柜列表 ===== */
.panel-title{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--text-faint);padding:12px 14px 8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.panel-title .cnt{font-weight:400;color:var(--text-faint)}
.zone-block{margin-bottom:4px}
.zone-head{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--text-dim)}
.zone-head:hover{color:var(--text);background:var(--panel-2)}
.zone-head .zname{flex:1;font-weight:600}
.zone-head .zstat{font-size:10px}
.rack-item{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 26px;cursor:pointer;font-size:12px;border-left:2px solid transparent}
.rack-item:hover{background:var(--panel-2)}
.rack-item.active{background:var(--panel-3);border-left-color:var(--green);color:var(--text)}
.rack-item .rname{flex:1}
.rack-item .rname b{display:block;font-size:12px}
.rack-item .rname span{font-size:10px;color:var(--text-faint)}
.rack-mini{display:flex;gap:2px;flex:none}
.rack-mini .u{width:7px;height:7px;border-radius:2px}
.mini-ok{background:var(--green-d)}
.mini-warn{background:var(--amber)}
.mini-fault{background:var(--red)}
.mini-off{background:var(--line-2)}
.legend{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--text-faint)}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend .sw{width:9px;height:9px;border-radius:3px}

/* ===== 主区 ===== */
.main-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.main-head h2{font-size:15px;font-weight:700}
.main-head .sub{font-size:11px;color:var(--text-faint)}
.view-toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.view-toggle button{padding:6px 14px;font-size:12px;color:var(--text-dim)}
.view-toggle button.active{background:var(--green-d);color:#07130d;font-weight:600}
.main-body{flex:1;overflow:auto;padding:16px;position:relative}

/* 机柜总览 */
.rack-overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ro-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
.ro-card:hover{border-color:var(--green);transform:translateY(-2px)}
.ro-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ro-head b{font-size:13px}
.ro-head .zone{font-size:10px;color:var(--text-faint)}
.ro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:10px}
.ro-canvas{width:100%;height:110px;display:block;padding:8px;box-sizing:border-box}
.ro-cell{aspect-ratio:1.5;border-radius:3px;position:relative}
.ro-cell.off{background:#1b2530}
.ro-cell.ok{background:#123527}
.ro-cell.warn{background:#3a2a10}
.ro-cell.fault{background:#3a1713}
.ro-foot{display:flex;justify-content:space-between;padding:8px 12px;font-size:10px;color:var(--text-faint);border-top:1px solid var(--line)}
.ro-foot .pw{color:var(--text-dim)}

/* 单机柜详情 */
.rack-detail{display:flex;flex-direction:column;gap:14px}
.rd-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.rd-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.rd-card .k{font-size:10px;color:var(--text-faint)}
.rd-card .v{font-size:18px;font-weight:700;margin-top:3px}
.rd-card .v small{font-size:11px;color:var(--text-dim);font-weight:400}
.node-table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.node-table{width:100%;border-collapse:collapse;table-layout:fixed}
.node-table th{font-size:10px;color:var(--text-faint);text-align:left;padding:9px 12px;background:var(--bg-2);border-bottom:1px solid var(--line);font-weight:600}
.node-table td{padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}
.node-table tr:hover td{background:var(--panel-2)}
.node-table tr.sel td{background:#16251f}
.node-status{display:flex;align-items:center;gap:6px}
.node-status .ns{width:8px;height:8px;border-radius:50%}
.ns.ok{background:var(--green)} .ns.warn{background:var(--amber)} .ns.fault{background:var(--red)} .ns.off{background:var(--line-2)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px}
.bar.b-cpu>i{background:var(--blue)}
.bar.b-mem>i{background:var(--cyan)}
.bar.b-temp>i{background:var(--amber)}
.bar.b-temp.hot>i{background:var(--red)}
.node-ops{display:flex;gap:4px}
.nop{width:26px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--panel-3);color:var(--text-dim);border:1px solid var(--line)}
.nop:hover{color:var(--text);border-color:var(--line-2)}
.nop.power:hover{color:var(--green);border-color:var(--green)}
.nop.reboot:hover{color:var(--amber);border-color:var(--amber)}
.nop.sel:hover{color:var(--blue);border-color:var(--blue)}

/* 环境/功耗曲线 */
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.chart-head h4{font-size:13px}
.chart-head .now{font-size:18px;font-weight:700}
.chart-head .now small{font-size:11px;color:var(--text-dim);font-weight:400}
canvas.chart{width:100%;height:130px;display:block}

/* ===== 右面板 ===== */
.right-body{padding:0 14px 18px}
.section{margin-bottom:16px}
.section>h4{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--text-faint);text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.section>h4 .more{color:var(--green);font-weight:600;cursor:pointer}
.node-detail-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px}
.nd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.nd-head b{font-size:14px}
.nd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nd-item{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.nd-item .k{font-size:9px;color:var(--text-faint)}
.nd-item .v{font-size:13px;font-weight:600;margin-top:1px}
.nd-item .v.warn{color:var(--amber)}
.nd-item .v.bad{color:var(--red)}
.nd-item .v.ok{color:var(--green)}
.service-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.svc{font-size:10px;padding:3px 7px;border-radius:12px;border:1px solid var(--line)}
.svc.on{color:var(--green);border-color:#245c43}
.svc.down{color:var(--red);border-color:#5c312c}
.nd-actions{display:flex;gap:6px;margin-top:11px}
.nd-actions .tbtn{flex:1;justify-content:center;height:30px;font-size:11px}
.empty-detail{color:var(--text-faint);font-size:12px;line-height:1.8;padding:8px 2px}

/* 告警 */
.alert-list{display:flex;flex-direction:column;gap:7px}
.alert{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;border-left:3px solid var(--amber);font-size:11px}
.alert.crit{border-left-color:var(--red)}
.alert.info{border-left-color:var(--blue)}
.alert .ahead{display:flex;justify-content:space-between;margin-bottom:4px}
.alert .alvl{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.alert.crit .alvl{color:var(--red)}
.alert.info .alvl{color:var(--blue)}
.alert .atime{font-size:10px;color:var(--text-faint)}
.alert .amsg{color:var(--text);line-height:1.5}

/* 日志 */
.log-list{display:flex;flex-direction:column;gap:5px}
.log{font-size:11px;padding:6px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);line-height:1.5}
.log .lt{color:var(--text-faint);font-size:10px;margin-right:6px}
.log .lo{color:var(--green)}
.log .lx{color:var(--amber)}
.log .lb{color:var(--red)}

/* 确认模态 */
.modal-mask{position:fixed;inset:0;background:rgba(5,8,10,.6);display:none;align-items:center;justify-content:center;z-index:50}
.modal-mask.show{display:flex}
.modal{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:22px;width:400px;max-width:92vw;box-shadow:var(--shadow)}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:18px}
.modal .m-actions{display:flex;gap:8px;justify-content:flex-end}
.modal .m-actions .tbtn{height:34px;padding:0 16px}

@media (max-width:1000px){
  .app{grid-template-columns:190px 1fr;grid-template-rows:52px 1fr 1fr 30px}
  .toolbar{grid-column:1/3;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
  .right-panel{grid-column:1/3;grid-row:3;border-left:none;border-top:1px solid var(--line);max-height:280px}
  .left-panel{grid-row:2}
  .main{grid-row:2}
  .statusbar{grid-column:1/3}
  .kpi-pill .l{display:none}
  .toolbar .kpi-pill{flex:none}
  .toolbar .brand{flex:none}
  .toolbar .spacer{display:none}
  .toolbar .view-toggle{flex:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 顶栏 ===== -->
  <header class="toolbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0e1720"/><rect x="5" y="6" width="14" height="5" rx="1" fill="#2ec98a"/><rect x="5" y="14" width="14" height="5" rx="1" fill="#5b9bd5"/><rect x="5" y="22" width="14" height="5" rx="1" fill="#f2a93b"/><circle cx="23" cy="24" r="2.4" fill="#2ec98a"/><path d="M25 8h4M27 10v-4" stroke="#2ec98a" stroke-width="1.6"/></svg>
      <div><b>机房控制面板</b><span>大规模机组监控 · 模拟器</span></div>
    </div>
    <span class="tbadge kpi-pill"><span class="dot" style="background:var(--green)"></span><span class="l">总节点</span><span class="v" id="kpiTotal">0</span></span>
    <span class="kpi-pill"><span class="l">在线</span><span class="v" style="color:var(--green)" id="kpiOnline">0</span></span>
    <span class="kpi-pill"><span class="l">告警</span><span class="v hot" id="kpiWarn">0</span></span>
    <span class="kpi-pill"><span class="l">总功耗</span><span class="v" id="kpiPower">0 kW</span></span>
    <span class="kpi-pill"><span class="l">机房温度</span><span class="v" id="kpiTemp">0°C</span></span>
    <div class="spacer"></div>
    <div class="view-toggle" style="margin-right:2px">
      <button data-size="small">小型机房</button>
      <button data-size="medium">中型</button>
      <button data-size="large" class="active">大数据中心</button>
    </div>
    <span class="kpi-pill" style="border-color:var(--green)"><span class="l">仿真运行中</span><span class="dot pulse" style="background:var(--green)"></span></span>
  </header>

  <!-- ===== 左面板 ===== -->
  <aside class="left-panel">
    <div class="panel-title">机柜机组 <span class="cnt" id="zoneCount">0 区域</span></div>
    <div id="zoneList"></div>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:var(--green-d)"></span>正常</span>
      <span class="lg"><span class="sw" style="background:var(--amber)"></span>警告</span>
      <span class="lg"><span class="sw" style="background:var(--red)"></span>故障</span>
      <span class="lg"><span class="sw" style="background:var(--line-2)"></span>关机</span>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <main class="main">
    <div class="main-head">
      <h2 id="mainTitle">机柜总览</h2>
      <span class="sub" id="mainSub">全部区域 · 实时仿真</span>
      <div class="spacer"></div>
      <div class="view-toggle">
        <button id="viewOverview" class="active">机柜总览</button>
        <button id="viewRack">单机柜</button>
      </div>
    </div>
    <div class="main-body" id="mainBody"></div>
  </main>

  <!-- ===== 右面板 ===== -->
  <aside class="right-panel">
    <div class="panel-title">监控 · 操作</div>
    <div class="right-body">
      <div class="section">
        <h4>环境与功耗 <span class="more" id="chartExpand" style="font-size:10px">环境</span></h4>
        <div class="chart-card">
          <div class="chart-head"><h4>总功耗 (kW)</h4><span class="now" id="chartPowerNow">0</span></div>
          <canvas class="chart" id="chartPower"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-head"><h4>环境温度 (°C)</h4><span class="now" id="chartTempNow">0</span></div>
          <canvas class="chart" id="chartTemp"></canvas>
        </div>
      </div>
      <div class="section">
        <h4>实时告警 <span class="more" id="clearAlerts">清空</span></h4>
        <div class="alert-list" id="alertList"><div class="empty-detail">暂无告警</div></div>
      </div>
      <div class="section">
        <h4>节点详情</h4>
        <div id="nodeDetail"><div class="empty-detail">在机柜视图中点击节点查看详情与操作。</div></div>
      </div>
      <div class="section">
        <h4>操作日志 <span class="more" id="clearLogs">清空</span></h4>
        <div class="log-list" id="logList"></div>
      </div>
    </div>
  </aside>

  <footer class="statusbar">
    <span id="sbLeft">仿真数据引擎运行中</span>
    <span id="sbRight">更新时间 1s · 模拟环境</span>
  </footer>
</div>

<!-- 确认模态 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle">确认操作</h3>
    <p id="modalMsg"></p>
    <div class="m-actions">
      <button class="tbtn ghost" id="modalCancel">取消</button>
      <button class="tbtn green" id="modalOk">确认</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * 服务器机组控制面板 — 核心逻辑
 * ========================================================== */
"use strict";

/* ---------- 配置 ---------- */
const SIZES = {
  small: { label:"小型机房", zones:3, racksPerZone:4, unitsPerRack:8 },   // 3×4×8=96
  medium:{ label:"中型机房", zones:4, racksPerZone:6, unitsPerRack:24 },  // 4×6×24=576
  large: { label:"大数据中心", zones:5, racksPerZone:8, unitsPerRack:40 } // 5×8×40=1600
};
let SIZE = SIZES.large;

const ZONE_NAMES = {
  A:"计算区", B:"存储区", C:"网络区", D:"GPU·AI区", E:"数据库区"
};
const ZONE_ROLE = { A:["compute","worker","gpu"], B:["storage","db","backup"], C:["proxy","edge","cache"], D:["gpu","ai","compute"], E:["db","cache","compute"] };

function buildConfig(){
  const zc=[];
  const codes=Object.keys(ZONE_NAMES).slice(0,SIZE.zones);
  codes.forEach(code=>{
    const racks=[];
    for(let i=1;i<=SIZE.racksPerZone;i++) racks.push(`R${code}${String(i).padStart(2,"0")}`);
    zc.push({ code, name:`${code} 区 · ${ZONE_NAMES[code]}`, racks });
  });
  return zc;
}

/* ---------- 状态 ---------- */
const state = {
  zones: [],                 // {code,name,racks:[rack]}
  racks: [],                 // 展平的rack列表
  selectedRack: null,        // 当前机柜code
  selectedNode: null,        // 当前节点id
  view: "overview",          // overview | rack
  logs: [],
  alerts: [],
  powerHist: [],             // 功耗历史
  tempHist: [],              // 温度历史
  envTemp: 22,               // 当前环境温度
  envHumidity: 45,
  envPower: 0,               // 当前总功耗kW
  tick: 0
};

/* ---------- 工具 ---------- */
const uid = () => Math.random().toString(36).slice(2, 8);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const jitter = (base, amp) => base + (Math.random()-0.5)*2*amp;
const fmt1 = v => Math.round(v*10)/10;
const rand = (a,b)=>a+Math.random()*(b-a);
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const HOSTNAMES = ["compute","storage","node","worker","db","cache","edge","gpu","api","search"];
const SERVICES = ["nginx","mysql","redis","kafka","docker","etcd","prometheus","grafana","hadoop","spark","fluentd","zookeeper"];
const IP = ()=>`10.${rand(0,255)|0}.${rand(0,255)|0}.${rand(2,254)|0}`;

/* ---------- 生成数据 ---------- */
function makeNode(rack, idx){
  const role = pick(ZONE_ROLE[rack.zone]||ZONE_ROLE.A);
  const running = Math.random() > 0.07;   // 7% 初始关机
  const cpuBase = running ? rand(8,60) : 0;
  const memBase = running ? rand(30,70) : 0;
  const hot = Math.random() < 0.05;       // 5% 初始偏热
  return {
    id: uid(), rack: rack.code, slot: idx+1, hostname: `${role}-${rack.code.toLowerCase()}${String(idx+1).padStart(3,"0")}`,
    ip: IP(), role, running,
    cpu: cpuBase, mem: memBase,
    temp: running ? (hot ? rand(74,88) : rand(38,62)) : 24,
    power: running ? rand(0.25,0.9) : 0,     // kW
    load: running ? rand(0.2,0.9) : 0,       // 业务负载
    services: SERVICES.map(s=>({name:s, on: Math.random()>0.25}))
  };
}
function makeRack(code, zone, name){
  const rack = { code, zone, name, nodes:[] };
  for(let i=0;i<SIZE.unitsPerRack;i++) rack.nodes.push(makeNode(rack, i));
  return rack;
}
function buildWorld(){
  const zc = buildConfig();
  state.zones = zc.map(z=>({
    code:z.code, name:z.name,
    racks: z.racks.map(r=>makeRack(r,z.code,z.name))
  }));
  state.racks = state.zones.flatMap(z=>z.racks);
}

/* ---------- 节点状态 ---------- */
function nodeStatus(n){
  if(!n.running) return "off";
  if(n.temp>80 || n.cpu>92 || n.mem>92) return "fault";
  if(n.temp>68 || n.cpu>80 || n.mem>85) return "warn";
  return "ok";
}

/* ---------- 操作 ---------- */
function setNodePower(node, on){
  node.running = on;
  if(on){ node.cpu=jitter(20,15); node.mem=jitter(40,15); node.temp=jitter(48,10); node.power=jitter(0.5,0.2); }
  else { node.cpu=0; node.mem=0; node.temp=jitter(25,2); node.power=0; node.services.forEach(s=>s.on=false); }
  log(`${node.hostname} 已${on?"开机":"关机"}`, "o");
  render();
}
function rebootNode(node){
  node.running=false; node.power=0;
  log(`${node.hostname} 正在重启...`, "x");
  setTimeout(()=>{ node.running=true; node.cpu=jitter(15,10); node.power=jitter(0.45,0.15); log(`${node.hostname} 重启完成`, "o"); render(); }, 1200);
  render();
}
function selNode(node){
  // 模拟选中执行
  log(`已选中 ${node.hostname}`, "x");
}

/* ---------- 日志 / 告警 ---------- */
function log(msg, type="o"){
  const t = new Date().toLocaleTimeString("zh-CN",{hour12:false});
  state.logs.unshift({t,msg,type});
  if(state.logs.length>60) state.logs.pop();
  renderLogs();
}
function pushAlert(level, msg){
  const t = new Date().toLocaleTimeString("zh-CN",{hour12:false});
  state.alerts.unshift({level,msg,t});
  if(state.alerts.length>50) state.alerts.pop();
  renderAlerts();
}

/* 机柜总览（Canvas 热力图，支撑大规模） */
function drawRackCanvas(rack, cv){
  const dpr=window.devicePixelRatio||1;
  const cols=rack.nodes.length>24?10:8;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==Math.floor(w*dpr)||cv.height!==Math.floor(h*dpr)){ cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr); }
  const c=cv.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  const rows=Math.ceil(rack.nodes.length/cols);
  const pad=3;
  const cw=(w-pad*(cols+1))/cols, ch=(h-pad*(rows+1))/rows;
  const colors={ok:"#123527", warn:"#3a2a10", fault:"#3a1713", off:"#1b2530"};
  rack.nodes.forEach((n,i)=>{
    const col=i%cols, row=(i/cols)|0;
    const x=pad+col*(cw+pad), y=pad+row*(ch+pad);
    c.fillStyle=colors[nodeStatus(n)];
    c.fillRect(x,y,cw,ch);
  });
}

/* ============================================================
 * 图表（Canvas）
 * ========================================================== */
function drawChart(canvasId, data, color, max){
  const cv=$(canvasId); const c=cv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr||cv.height!==h*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  // 网格
  c.strokeStyle="rgba(141,160,174,.12)"; c.lineWidth=1;
  c.beginPath();
  for(let i=1;i<5;i++){ const y=h*i/5; c.moveTo(0,y); c.lineTo(w,y); }
  c.stroke();
  if(data.length<2) return;
  const maxV=max||Math.max(...data)*1.15||1;
  const step=w/(data.length-1);
  c.beginPath();
  data.forEach((v,i)=>{ const x=i*step, y=h-(v/maxV)*h; i?c.lineTo(x,y):c.moveTo(x,y); });
  c.strokeStyle=color; c.lineWidth=2; c.lineJoin="round"; c.stroke();
  // 填充
  c.lineTo(w,h); c.lineTo(0,h); c.closePath();
  const g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,color+"55"); g.addColorStop(1,color+"05");
  c.fillStyle=g; c.fill();
}
function drawCharts(){
  drawChart("chartPower", state.powerHist, "#2ec98a", 60);
  drawChart("chartTemp", state.tempHist, "#f2a93b", 40);

/* ============================================================
 * 仿真引擎
 * ========================================================== */
let simTimer=null;
function tickSim(){
  state.tick++;
  let totalPower=0, onlineNodes=0, warnNodes=0;
  const coolingHeat = state.envTemp>26 ? 0.5 : 0.15;   // 温度越高散热耗电越多

  for(let zi=0; zi<state.zones.length; zi++){
    const racks=state.zones[zi].racks;
    for(let ri=0; ri<racks.length; ri++){
      const nodes=racks[ri].nodes;
      for(let ni=0; ni<nodes.length; ni++){
        const n=nodes[ni];
        if(!n.running) continue;
        onlineNodes++;
        n.load = clamp(n.load + (Math.random()-0.5)*0.15, 0.1, 0.98);
        n.cpu = clamp(n.cpu + (n.load-0.5)*14 + (Math.random()-0.5)*6, 3, 100);
        n.mem = clamp(n.mem + (Math.random()-0.5)*4, 20, 96);
        const target = 36 + n.load*45 + (n.cpu>85?10:0);
        n.temp = clamp(n.temp + (target-n.temp)*0.06 + (Math.random()-0.5)*1.6, 26, 96);
        n.power = clamp(n.power + (0.15+n.load*0.7 - n.power)*0.05 + (Math.random()-0.5)*0.05, 0.1, 1.4);
        totalPower += n.power;
        if(n.temp>68 || n.cpu>80 || n.mem>85) warnNodes++;
      }
    }
  }
  // 环境温度与湿度联动
  state.envTemp = clamp(state.envTemp + (state.envTemp>27?0.06:-0.04) + (Math.random()-0.5)*0.3, 19, 33);
  state.envHumidity = clamp(state.envHumidity + (Math.random()-0.5)*1.5, 35, 60);
  state.envPower = totalPower + (state.envPower-totalPower)*0.3 + coolingHeat;
  // 历史记录
  state.powerHist.push(state.envPower);
  state.tempHist.push(state.envTemp);
  if(state.powerHist.length>90) state.powerHist.shift();
  if(state.tempHist.length>90) state.tempHist.shift();

  // 顶部KPI
  const totalNodesN = totalNodes();
  $("kpiTotal").textContent=totalNodesN;
  $("kpiOnline").textContent=onlineNodes;
  $("kpiWarn").textContent=warnNodes;
  $("kpiPower").textContent=fmt1(state.envPower)+" kW";
  $("kpiTemp").textContent=Math.round(state.envTemp)+"°C";
  $("kpiTemp").classList.toggle("hot", state.envTemp>27);

  // 偶发告警（按规模调概率，避免过密）
  const alertRate = totalNodesN>1000 ? 0.02 : 0.012;
  if(Math.random()<alertRate){
    const r=pick(state.racks); const n=pick(r.nodes);
    if(n.running && n.temp>75) pushAlert("crit", `${n.hostname} 温度过高 ${Math.round(n.temp)}°C，建议检查散热`);
    else if(n.running && n.cpu>90) pushAlert("warn", `${n.hostname} CPU 负载 ${Math.round(n.cpu)}% 超过阈值`);
  }
  if(Math.random()<0.005 && state.envTemp>30){
    pushAlert("warn", `机房环境温度 ${Math.round(state.envTemp)}°C 偏高`);
  }

  renderChartsAndList();
  drawCharts();
}
function renderChartsAndList(){
  // 增量更新当前视图，避免重建大 DOM
  refreshZones();           // 轻量更新机柜 mini 灯 + 在线数
  if(state.view==="overview") refreshOverview();
  else refreshRackTable();
  renderAlerts();
  renderLogs();
  renderNodeDetail();
  $("sbLeft").textContent=`仿真运行 ${state.tick}s · ${state.racks.length} 机柜 · ${totalNodes()} 节点 · 总功耗 ${fmt1(state.envPower)} kW`;
  $("sbRight").textContent=`环境 ${Math.round(state.envTemp)}°C / ${Math.round(state.envHumidity)}% RH · 更新 1s`;
}
function render(){
  renderZones();
  if(state.view==="overview") renderOverview();
  else renderRackDetail();
  renderAlerts();
  renderLogs();
  renderNodeDetail();
  drawCharts();
}
/* 增量刷新单机柜表格（不重建DOM） */
function refreshRackTable(){
  const r = state.racks.find(x=>x.code===state.selectedRack);
  if(!r) return;
  const rows=mainBody.querySelectorAll(".node-table tbody tr");
  r.nodes.forEach((n,i)=>{
    const tr=rows[i]; if(!tr) return;
    const st=nodeStatus(n);
    tr.querySelector(".ns").className="ns "+st;
    tr.querySelector(".node-status span:last-child").textContent = st==="off"?"关机":st==="ok"?"正常":st==="warn"?"警告":"故障";
    const c=tr.children[3]; if(n.running){ c.innerHTML=`${Math.round(n.cpu)}%<br><div class="bar b-cpu"><i style="width:${n.cpu}%"></i></div>`; }
    else c.innerHTML="—<br><span style='color:var(--text-faint)'>—</span>";
    const m=tr.children[4]; if(n.running){ m.innerHTML=`${Math.round(n.mem)}%<br><div class="bar b-mem"><i style="width:${n.mem}%"></i></div>`; }
    else m.innerHTML="—<br><span style='color:var(--text-faint)'>—</span>";
    const t=tr.children[5]; t.style.color = st==="fault"?"var(--red)":st==="warn"?"var(--amber)":"var(--text)";
    t.textContent = n.running?Math.round(n.temp)+"°C":"—";
    tr.children[6].textContent = n.running?fmt1(n.power)+" kW":"—";
  });
  // 摘要卡
  const sCount={ok:0,warn:0,fault:0,off:0};
  r.nodes.forEach(n=>sCount[nodeStatus(n)]++);
  const power=r.nodes.reduce((a,n)=>a+n.power,0);
  const cards=mainBody.querySelectorAll(".rd-card .v");
  if(cards.length>=5){
    cards[1].innerHTML = `<span style="color:var(--green)">${sCount.ok+sCount.warn+sCount.fault}</span><small> / ${r.nodes.length}</small>`;
    cards[2].innerHTML = `<span style="color:${sCount.fault?"var(--red)":sCount.warn?"var(--amber)":"var(--text)"}">${sCount.fault+sCount.warn}</span>`;
    cards[3].innerHTML = `${fmt1(power)} <small>kW</small>`;
  }
}

/* ============================================================
 * 确认模态
 * ========================================================== */
let modalCb=null;
function confirmAction(title,msg,cb){
  $("modalTitle").textContent=title;
  $("modalMsg").textContent=msg;
  $("modalMask").classList.add("show");
  modalCb=cb;
}
$("modalCancel").onclick=()=>$("modalMask").classList.remove("show");
$("modalOk").onclick=()=>{ $("modalMask").classList.remove("show"); if(modalCb){modalCb();modalCb=null;} };

/* ============================================================
 * 事件绑定 & 初始化
 * ========================================================== */
$("viewOverview").onclick=()=>setView("overview");
$("viewRack").onclick=()=>{ if(!state.selectedRack) state.selectedRack=state.racks[0].code; setView("rack"); };
$("clearAlerts").onclick=()=>{ state.alerts=[]; renderAlerts(); log("已清空告警记录","x"); };
$("clearLogs").onclick=()=>{ state.logs=[]; renderLogs(); };

function init(){
  buildWorld();
  state.selectedRack = state.racks[0].code;
  state.selectedNode = state.racks[0].nodes[3].id;
  // 初始图表数据
  for(let i=0;i<40;i++){ state.powerHist.push(20+Math.random()*10); state.tempHist.push(21+Math.random()*3); }
  render();
  log("系统启动 · 机组仿真初始化完成","o");
  log(`已载入 ${state.racks.length} 个机柜，共 ${totalNodes()} 个节点 (${SIZE.label})`,"x");
  pushAlert("info",`监控系统已连接 · ${SIZE.label} · 数据每 1 秒刷新`);
  simTimer = setInterval(tickSim, 1000);
  window.addEventListener("resize", ()=>{ drawCharts(); if(state.view==="overview") refreshOverview(); });
}
/* 规模切换 */
document.querySelectorAll("[data-size]").forEach(btn=>{
  btn.onclick=()=>{
    const sz=btn.dataset.size;
    SIZE = SIZES[sz];
    document.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("active", b===btn));
    clearInterval(simTimer);
    state.selectedRack=null; state.selectedNode=null;
    state.alerts=[]; state.logs=[];
    state.powerHist=[]; state.tempHist=[];
    for(let i=0;i<40;i++){ state.powerHist.push(20+Math.random()*10); state.tempHist.push(21+Math.random()*3); }
    buildWorld();
    state.selectedRack = state.racks[0].code;
    setView("overview");
    log(`已切换至 ${SIZE.label} · ${state.racks.length} 机柜 / ${totalNodes()} 节点`,"x");
    pushAlert("info",`已切换至 ${SIZE.label}（${totalNodes()} 节点）`);
    render();
    simTimer = setInterval(tickSim, 1000);
  };
});
init();
